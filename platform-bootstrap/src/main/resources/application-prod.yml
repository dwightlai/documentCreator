spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/postgresql
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          jwk-set-uri: ${OIDC_JWK_SET_URI}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

platform:
  coordination:
    type: ${PLATFORM_COORDINATION_TYPE:redis}
  security:
    local-header-enabled: false
    allowed-origins: ${PLATFORM_ALLOWED_ORIGINS}
  integration:
    oa:
      callback-allowlist: ${OA_CALLBACK_ALLOWLIST:}
      shared-secret: ${OA_SHARED_SECRET:}
      callback-timeout: ${OA_CALLBACK_TIMEOUT:10s}
  storage:
    type: ${PLATFORM_STORAGE_TYPE:minio}
    file-root: ${PLATFORM_FILE_STORAGE_ROOT:/app/data/files}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://minio:9000}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:document-platform}
  model:
    allow-http-local: false
    allowed-endpoints: ${MODEL_ALLOWED_ENDPOINTS:}
