spring:
  application:
    name: ai-document-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:18089}
  shutdown: graceful
  forward-headers-strategy: framework

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

platform:
  security:
    local-header-enabled: false
    allowed-origins: ${PLATFORM_ALLOWED_ORIGINS:http://localhost:5175,http://127.0.0.1:5175,http://localhost:4173,http://127.0.0.1:4173}
  integration:
    oa:
      callback-allowlist: ${OA_CALLBACK_ALLOWLIST:}
      shared-secret: ${OA_SHARED_SECRET:}
      callback-timeout: ${OA_CALLBACK_TIMEOUT:10s}
  ocr:
    # 内网 OCR 服务地址，留空则不启用；扫描版 PDF 将提示人工录入
    endpoint: ${PLATFORM_OCR_ENDPOINT:}
    timeout: ${PLATFORM_OCR_TIMEOUT:60s}
    # 访问令牌所在的环境变量名（不直接写令牌）
    token-env: ${PLATFORM_OCR_TOKEN_ENV:}
  knowledge:
    # 向量化服务（OpenAI-compatible /embeddings），留空则知识检索只使用全文模式
    embedding:
      endpoint: ${KNOWLEDGE_EMBEDDING_ENDPOINT:}
      model: ${KNOWLEDGE_EMBEDDING_MODEL:bge-m3}
      token-env: ${KNOWLEDGE_EMBEDDING_TOKEN_ENV:}
    # database：向量以 CLOB 存于切片表（适合中小规模）；milvus：使用 Milvus REST v2
    vector-store: ${KNOWLEDGE_VECTOR_STORE:database}
    vector-min-score: 0.5
    milvus:
      endpoint: ${MILVUS_ENDPOINT:}
      collection: ${MILVUS_COLLECTION:knowledge_chunks}
      dimensions: ${MILVUS_DIMENSIONS:1024}
      token-env: ${MILVUS_TOKEN_ENV:}
  retention:
    ai-generated-days: 30
    ai-generated-max: 50
    purge-grace-days: 7
  coordination:
    # memory 仅适用于单实例开发；多实例部署必须使用 redis
    type: ${PLATFORM_COORDINATION_TYPE:memory}
  storage:
    type: ${PLATFORM_STORAGE_TYPE:local}
    file-root: ${PLATFORM_FILE_STORAGE_ROOT:./data/files}
  model:
    allow-http-local: true
    allowed-endpoints: ${MODEL_ALLOWED_ENDPOINTS:}
