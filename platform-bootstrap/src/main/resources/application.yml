spring:
  application:
    name: ai-document-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:18089}
  shutdown: graceful
  forward-headers-strategy: framework

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

platform:
  security:
    local-header-enabled: false
    allowed-origins: ${PLATFORM_ALLOWED_ORIGINS:http://localhost:5175,http://127.0.0.1:5175,http://localhost:4173,http://127.0.0.1:4173}
  integration:
    oa:
      callback-allowlist: ${OA_CALLBACK_ALLOWLIST:}
      shared-secret: ${OA_SHARED_SECRET:}
      callback-timeout: ${OA_CALLBACK_TIMEOUT:10s}
  coordination:
    # memory 仅适用于单实例开发；多实例部署必须使用 redis
    type: ${PLATFORM_COORDINATION_TYPE:memory}
  storage:
    type: ${PLATFORM_STORAGE_TYPE:local}
    file-root: ${PLATFORM_FILE_STORAGE_ROOT:./data/files}
  model:
    allow-http-local: true
    allowed-endpoints: ${MODEL_ALLOWED_ENDPOINTS:}
