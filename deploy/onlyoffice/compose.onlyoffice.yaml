# 可选：定稿稿在线编辑（ONLYOFFICE Docs）。默认部署不包含本服务。
# 启用前请确认：社区版为 AGPL v3 许可并限制同时编辑连接数，超出需购买企业版；如项目有信创要求，请先确认是否允许使用。
# 启动：docker compose -f compose.yaml -f deploy/onlyoffice/compose.onlyoffice.yaml --env-file .env up -d
services:
  onlyoffice:
    image: onlyoffice/documentserver:${ONLYOFFICE_VERSION:-9.4.0}
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?请设置 ONLYOFFICE_JWT_SECRET（至少 32 字节，与平台一致）}
      JWT_HEADER: Authorization
      # 文档服务器需访问内网中的平台后端（拉取定稿稿、保存回调）
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
      # 公文字体（仿宋_GB2312、方正小标宋简体、楷体_GB2312 等）需自行取得授权后放入该目录
      - ${ONLYOFFICE_FONTS_DIR:-./deploy/onlyoffice/fonts}:/usr/share/fonts/truetype/custom:ro
    restart: unless-stopped

  backend:
    environment:
      PLATFORM_ONLYOFFICE_ENABLED: "true"
      PLATFORM_ONLYOFFICE_PUBLIC_URL: ${PLATFORM_PUBLIC_URL:-http://localhost:8088}/office
      PLATFORM_ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      PLATFORM_ONLYOFFICE_CALLBACK_BASE_URL: http://backend:18089
      PLATFORM_ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}

  web:
    # 前端 nginx 增加 /office/ 同源代理：编辑器脚本与页面与平台同源，无需放宽内容安全策略
    volumes:
      - ./deploy/onlyoffice/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      onlyoffice: { condition: service_started }

volumes:
  onlyoffice-data:
  onlyoffice-logs:
