name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Validate operations scripts and Keycloak realm JSON
        run: |
          bash -n deploy/ops/*.sh
          python -m json.tool deploy/keycloak/platform-realm.json >/dev/null
      - name: Unit and H2 integration tests
        run: bash mvnw -B -ntp -pl platform-bootstrap -am test
      - name: Package backend
        run: bash mvnw -B -ntp -pl platform-bootstrap -am package -DskipTests
      - uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: platform-bootstrap/target/platform-bootstrap-*.jar
          if-no-files-found: error
          retention-days: 14

  postgres-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_POSTGRES_TESTS: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: PostgreSQL migration and logical CLOB compatibility
        run: >-
          bash mvnw -B -ntp -pl platform-bootstrap -am
          -Dtest=PostgreSqlClobCompatibilityTest
          -Dsurefire.failIfNoSpecifiedTests=false test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform-web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: platform-web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: platform-web/dist
          if-no-files-found: error
          retention-days: 14

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: platform-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: platform-web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: platform-web/pnpm-lock.yaml
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: platform-bootstrap/target
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: platform-web/dist
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and operating-system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Writing flow and accessibility acceptance
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            platform-web/playwright-report
            platform-web/test-results
          if-no-files-found: error
          retention-days: 14

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, browser-e2e, postgres-compatibility]
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose topology
        run: docker compose --env-file .env.example config --quiet
      - name: Scan repository dependencies, secrets and IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build backend image
        run: docker build --tag document-platform-backend:${{ github.sha }} .
      - name: Build frontend image
        run: docker build --tag document-platform-web:${{ github.sha }} platform-web
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: document-platform-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: document-platform-web:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate backend CycloneDX SBOM
        if: success()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: document-platform-backend:${{ github.sha }}
          format: cyclonedx
          output: backend-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: backend-sbom
          path: backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
