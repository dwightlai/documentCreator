name: Public source monitor

on:
  schedule:
    - cron: '20 1 * * 1'
  workflow_dispatch:

jobs:
  check-public-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: data/public-source-monitor/state.json
          key: public-source-baseline-${{ hashFiles('platform-bootstrap/src/main/resources/public-data/public-source-pack.json') }}
      - name: Check public pages
        id: check
        continue-on-error: true
        run: node tools/check_public_sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-source-monitor-report
          path: data/public-source-monitor/report.json
          if-no-files-found: warn
      - name: Require human review on change or error
        if: steps.check.outcome == 'failure'
        run: exit 1
